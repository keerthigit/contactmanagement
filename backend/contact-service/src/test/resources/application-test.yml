spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/contactdb
    username: contactuser
    password: contactpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    enabled: false
