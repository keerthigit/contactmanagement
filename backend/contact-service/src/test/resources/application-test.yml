spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/contactdb
    username: contactuser
    password: contactpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    enabled: false

app:
  security:
    users:
      read:
        username: reader_test
        password: reader_test_password
      write:
        username: writer_test
        password: writer_test_password
      admin:
        username: admin_test
        password: admin_test_password
