server:
  port: 8081

# REST API: HTTP Basic user/password (see SecurityConfig.DEV_USERNAME / DEV_PASSWORD).

spring:
  application:
    name: contact-service
  datasource:
    url: jdbc:postgresql://localhost:5432/contactdb
    username: contactuser
    password: contactpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    com.contactmanagement: DEBUG
    org.springframework.web: INFO
