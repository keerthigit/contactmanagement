server:
  port: 8081

spring:
  application:
    name: contact-service
  datasource:
    url: jdbc:postgresql://localhost:5432/contactdb
    username: contactuser
    password: contactpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    com.contactmanagement: DEBUG
    org.springframework.web: INFO

app:
  security:
    users:
      read:
        username: ${CONTACT_READ_USERNAME:contact_reader}
        password: ${CONTACT_READ_PASSWORD:change-me-read}
      write:
        username: ${CONTACT_WRITE_USERNAME:contact_writer}
        password: ${CONTACT_WRITE_PASSWORD:change-me-write}
      admin:
        username: ${CONTACT_ADMIN_USERNAME:contact_admin}
        password: ${CONTACT_ADMIN_PASSWORD:change-me-admin}
